# Self-host quickstart and local development: Postgres for metadata, MinIO
# for blobs, and the server image. `docker compose up -d` gives a working
# server on :8580; for development run only the backing services
# (`docker compose up -d postgres minio minio-init`) and `pnpm dev` the server
# with apps/server/.env.example.
services:
  server:
    image: ghcr.io/stift-sh/stift:latest
    build: .
    ports:
      - "8580:8580"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      STIFT_DATABASE_URL: postgres://stift:stift@postgres:5432/stift
      STIFT_S3_BUCKET: stift
      STIFT_S3_ENDPOINT: http://minio:9000
      STIFT_S3_REGION: us-east-1
      STIFT_S3_ACCESS_KEY: stift
      STIFT_S3_SECRET_KEY: stiftstift
      STIFT_S3_FORCE_PATH_STYLE: "true"
      # Optional: pin the admin token instead of reading it from first-boot logs.
      # Generate one with: echo "stf_$(openssl rand -hex 24)"
      # STIFT_ADMIN_TOKEN: stf_change-me
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stift
      POSTGRES_PASSWORD: stift
      POSTGRES_DB: stift
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stift"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stift
      MINIO_ROOT_PASSWORD: stiftstift
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket the server expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 stift stiftstift &&
      mc mb --ignore-existing local/stift
      "

volumes:
  postgres:
  minio:
