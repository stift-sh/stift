services:
  stift:
    build: .
    # image: ghcr.io/YOURUSER/stift:latest
    ports:
      - "8580:8580"
    volumes:
      - stift-data:/data
    environment:
      # Optional: pin the admin token instead of reading it from first-boot logs.
      # Generate one with: echo "stf_$(openssl rand -hex 24)"
      # STIFT_ADMIN_TOKEN: stf_change-me
      STIFT_LISTEN: ":8580"
    restart: unless-stopped

volumes:
  stift-data:
